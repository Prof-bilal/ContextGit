[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextgit"
version = "0.1.0"
description = "Version control for LLM conversations: branch, diff, merge, and roll back context."
readme = "files/README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2",
    "typer>=0.12",
]

[project.scripts]
ctx = "contextgit.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "mypy>=1.8",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["contextgit*"]

[tool.setuptools.package-data]
"contextgit.storage" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["contextgit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["contextgit"]

[tool.ruff.lint.per-file-ignores]
# Long SQL strings, hash fixtures, and CLI signatures legitimately exceed 100 chars
"tests/*" = ["E501"]
"contextgit/cli/*" = ["E501"]
