[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextgit"
version = "0.2.0b6"
description = "Version control for LLM conversations: branch, diff, merge, and roll back context."
readme = "docs/README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "pydantic>=2",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.scripts]
ctx = "contextgit.cli.main:main"
ctx-api = "contextgit.api.server:main"
contextgit-mcp = "contextgit.mcp.main:main"

[project.optional-dependencies]
mcp = [
    "mcp>=2",
]
# Database client: SQLite needs nothing (stdlib). These two are the network
# engines, imported lazily so a missing driver is a clear message, not a crash.
db = [
    "psycopg[binary]>=3.1",
    "pymssql>=2.2",
]
dev = [
    "mcp>=2",
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "mypy>=1.8",
    "ruff>=0.4",
    "httpx>=0.27",
    "pytest-playwright>=0.7",
]

[tool.setuptools.packages.find]
include = ["contextgit*"]

[tool.setuptools.package-data]
"contextgit.storage" = ["migrations/*.sql"]
"contextgit.merge" = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["contextgit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["contextgit"]

# Optional database drivers are imported lazily and may be absent.
[[tool.mypy.overrides]]
module = ["psycopg", "psycopg.*", "pymssql"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# Long SQL strings, hash fixtures, and CLI signatures legitimately exceed 100 chars
"tests/*" = ["E501"]
"contextgit/cli/*" = ["E501"]
