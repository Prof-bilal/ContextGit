name: ContextGit reliability

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
        cache: pip
    - name: Install dependencies
      run: |
        pip install -e ".[dev]"
    - run: ruff check contextgit
    - run: mypy contextgit
    - run: pytest

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install desktop backend
      run: |
        python -m venv .venv
        .venv/bin/pip install -e ".[dev]"
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: |
          package-lock.json
          desktop/package-lock.json
    - run: npm ci
    - run: npm ci --prefix desktop
    - name: Install desktop system dependencies
      run: npx playwright install --with-deps chromium
    - run: npm run typecheck --prefix desktop
    - run: npm run build:renderer --prefix desktop
    - run: npm run build:electron --prefix desktop
    - run: npm run test:lifecycle --prefix desktop
    - run: npm run test:markdown --prefix desktop
    - name: Retained MVP desktop workflows
      run: xvfb-run -a npx playwright test e2e/reliability.spec.ts --workers=1
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: desktop-failure-traces
        path: .playwright-results/
