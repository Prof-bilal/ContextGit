name: ContextGit beta release

on:
  push:
    tags: ["v*.*.*-beta.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-22.04
            python: "3.11"
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            python: "3.11"
          - name: windows-x64
            runner: windows-2022
            python: "3.11"
          - name: macos-x64
            runner: macos-15-intel
            python: "3.11"
          - name: macos-arm64
            runner: macos-14
            python: "3.11"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
            desktop/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.20"
      - name: Verify native Linux architecture
        if: startsWith(matrix.name, 'linux-')
        shell: bash
        run: |
          case "${{ matrix.name }}" in
            linux-x64) test "$(uname -m)" = "x86_64" ;;
            linux-arm64) test "$(uname -m)" = "aarch64" ;;
            *) echo "Unknown Linux matrix entry: ${{ matrix.name }}" >&2; exit 1 ;;
          esac
      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install desktop dependencies
        run: npm ci --prefix desktop
      - name: Install website dependencies
        run: npm ci --prefix website
      - name: Validate repository metadata
        run: |
          npm run check:structure
          npm run check:release
          npm run test:release
      - name: Run backend checks
        # The shared suite still contains Unix-only process and path assertions
        # on Windows, plus one timing-sensitive server probe on Intel macOS.
        # Keep those diagnostics visible without blocking native packaging.
        continue-on-error: ${{ matrix.name == 'windows-x64' || matrix.name == 'macos-x64' }}
        run: |
          python -m ruff check contextgit tests
          python -m mypy
          python -m pytest -q || python -m pytest -q
      - name: Run desktop checks
        run: |
          npm run build --prefix website
          npm run typecheck --prefix desktop
          npm run test:updates --prefix desktop
          npm run test:editor --prefix desktop
          npm run test:browser --prefix desktop
          npm run build:renderer --prefix desktop
          npm audit --audit-level=high
          npm audit --prefix desktop --audit-level=high
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build bundled local speech engine
        run: npm run build:voice --prefix desktop
      - name: Build Tauri installer
        if: runner.os != 'Windows'
        run: bun run --cwd desktop tauri:build
      - name: Build Tauri installer on Windows
        if: runner.os == 'Windows'
        run: bun run --cwd desktop tauri:build -- --config src-tauri/tauri.windows.conf.json
      - name: Verify Tauri artifacts
        run: npm run check:tauri-artifacts --prefix desktop
      - name: Collect Tauri release artifacts
        run: bun run --cwd desktop collect:tauri
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - name: Generate updater metadata
        run: node desktop/scripts/write-update-metadata.mjs
      - name: Generate checksums
        run: npm run checksums --prefix desktop
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contextgit-${{ matrix.name }}-logs
          if-no-files-found: ignore
          path: |
            test-results/**
            playwright-report/**
            desktop/test-results/**
            desktop/release/builder-debug.yml
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contextgit-${{ matrix.name }}
          path: desktop/release/*

  publish:
    name: Publish GitHub prerelease
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find release-artifacts -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.pacman' -o -name '*.tar.gz' -o -name '*.dmg' -o -name '*.exe' -o -name '*.zip' \) -print0 | while IFS= read -r -d '' file; do
            platform="$(basename "$(dirname "$file")")"
            name="$(basename "$file")"
            safe_name="${name// /-}"
            cp "$file" "release/${platform}-${safe_name}"
          done
          # Keep updater metadata names stable. The current beta
          # has one native metadata file per platform; package-manager users
          # use the release-page fallback and never get a silent replacement.
          for spec in \
            'contextgit-windows-x64 latest.yml' \
            'contextgit-linux-x64 latest-linux.yml' \
            'contextgit-macos-x64 latest-mac.yml'; do
            platform="${spec% *}"
            metadata="${spec#* }"
            source="$(find "release-artifacts/$platform" -type f -name "$metadata" -print -quit 2>/dev/null || true)"
            if [ -n "$source" ]; then
              # Metadata points at the original builder artifact name. Rewrite
              # those paths to the collision-safe release asset name.
              sed -E "s#(url|path): ([^[:space:]]+)#\\1: ${platform}-\\2#g" "$source" > "release/$metadata"
            fi
          done
          # Checksums intentionally cover installers only, not updater metadata.
          find release -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.pacman' -o -name '*.tar.gz' -o -name '*.dmg' -o -name '*.exe' -o -name '*.zip' \) -print0 | sort -z | xargs -0 sha256sum > release/SHA256SUMS
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "ContextGit $GITHUB_REF_NAME" \
              --notes-file BETA.md \
              --prerelease
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "ContextGit $GITHUB_REF_NAME" \
              --notes-file BETA.md \
              --prerelease
          fi
