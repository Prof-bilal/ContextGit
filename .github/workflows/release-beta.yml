name: ContextGit beta release

on:
  push:
    tags: ["v*.*.*-beta.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-22.04
            python: "3.11"
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            python: "3.11"
          - name: windows-x64
            runner: windows-2022
            python: "3.11"
          - name: macos-x64
            runner: macos-15-intel
            python: "3.11"
          - name: macos-arm64
            runner: macos-14
            python: "3.11"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Verify native Linux architecture
        if: startsWith(matrix.name, 'linux-')
        shell: bash
        run: |
          case "${{ matrix.name }}" in
            linux-x64) test "$(uname -m)" = "x86_64" ;;
            linux-arm64) test "$(uname -m)" = "aarch64" ;;
            *) echo "Unknown Linux matrix entry: ${{ matrix.name }}" >&2; exit 1 ;;
          esac
      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install desktop dependencies
        run: npm ci --prefix desktop
      - name: Install Electron runtime
        run: npm run install:electron --prefix desktop
      - name: Install E2E dependencies
        run: npm ci
      - name: Rebuild native Electron dependencies
        run: npm run rebuild:native --prefix desktop
      - name: Run backend checks
        # The shared suite still contains Unix-only process and path assertions
        # on Windows, plus one timing-sensitive server probe on Intel macOS.
        # Keep those diagnostics visible without blocking native packaging.
        continue-on-error: ${{ matrix.name == 'windows-x64' || matrix.name == 'macos-x64' }}
        run: |
          python -m ruff check contextgit tests
          python -m mypy
          python -m pytest -q || python -m pytest -q
      - name: Run desktop checks
        run: |
          npm run build
          npm run typecheck --prefix desktop
          npm run build:renderer --prefix desktop
          npm run build:electron --prefix desktop
          npm run test:lifecycle --prefix desktop
          npm run test:markdown --prefix desktop
          npm audit --audit-level=high
          npm audit --prefix desktop --audit-level=high
      - name: Run beta desktop E2E
        if: runner.os != 'Linux' && matrix.name != 'windows-x64'
        run: npx playwright test e2e/reliability.spec.ts e2e/feature-isolation.spec.ts e2e/beta.spec.ts --workers=1 --retries=2
      - name: Run beta desktop E2E on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npx playwright test e2e/reliability.spec.ts e2e/feature-isolation.spec.ts e2e/beta.spec.ts --workers=1 --retries=2
      - name: Build unpacked application
        run: npm run dist:dir --prefix desktop
      - name: Smoke test packaged application
        if: runner.os != 'Linux'
        run: npm run smoke:packaged --prefix desktop
      - name: Smoke test packaged application on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke:packaged --prefix desktop
      - name: Close packaged app on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Process ContextGit,contextgit,contextgit-desktop -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3
      - name: Remove unpacked smoke-test directory
        continue-on-error: ${{ runner.os == 'Windows' }}
        run: npm run clean:release --prefix desktop
      - name: Build installers
        run: npx electron-builder --projectDir desktop
      - name: Generate checksums
        run: npm run checksums --prefix desktop
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contextgit-${{ matrix.name }}-logs
          if-no-files-found: ignore
          path: |
            test-results/**
            playwright-report/**
            desktop/test-results/**
            desktop/release/builder-debug.yml
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contextgit-${{ matrix.name }}
          path: desktop/release/*

  publish:
    name: Publish GitHub prerelease
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find release-artifacts -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' -o -name '*.exe' -o -name '*.zip' \) -print0 | while IFS= read -r -d '' file; do
            platform="$(basename "$(dirname "$file")")"
            name="$(basename "$file")"
            safe_name="${name// /-}"
            cp "$file" "release/${platform}-${safe_name}"
          done
          sha256sum release/* > release/SHA256SUMS
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ContextGit $GITHUB_REF_NAME" \
            --notes-file BETA.md \
            --prerelease
